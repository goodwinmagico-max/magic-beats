name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Recreate clean Android platform and update Kotlin
        run: |
          # 1. Создаем чистую, поддерживаемую структуру Android
          rm -rf android
          flutter create temp_app --platforms=android --org com.magicbeats
          cp -r temp_app/android ./android
          rm -rf temp_app
          
          # 2. Устанавливаем minSdkVersion 23
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
          
          # 3. Аккуратно обновляем версию Kotlin в android/settings.gradle на 1.8.22
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.8.22"/g' android/settings.gradle
          
          # 4. Отключаем строгие предупреждения SDK
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "android.defaultConfig.vectorDrawables.useSupportLibrary=true" >> android/gradle.properties

      - name: Build APK Release
        run: flutter build apk --release --track-widget-creation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
