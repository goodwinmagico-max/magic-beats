name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate clean Android platform and fix Kotlin
        run: |
          # 1. Полностью сносим старую несовместимую папку android
          rm -rf android
          
          # 2. Создаем свежий поддерживаемый проект-шаблон под Android
          flutter create . --platforms=android --org com.magicbeats
          
          # 3. Настраиваем minSdkVersion 23
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
          
          # 4. Устанавливаем актуальную версию Kotlin 1.8.22 в корневой build.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.8.22'/g" android/build.gradle || true
          
          # 5. Отключаем строгие проверки SDK
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "android.defaultConfig.vectorDrawables.useSupportLibrary=true" >> android/gradle.properties

      - name: Build APK Release
        run: flutter build apk --release --track-widget-creation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
