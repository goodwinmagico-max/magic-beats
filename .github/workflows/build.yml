name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Android Configuration and Kotlin Version
        run: |
          # 1. Устанавливаем minSdkVersion 23 и compileSdkVersion 34 в существующем проекте
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle || true
          
          # 2. Гарантированно обновляем версию Kotlin до 1.8.22 во всех файлах gradle
          find android -type f -name "*.gradle" -exec sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.8.22'/g" {} +
          find android -type f -name "*.gradle" -exec sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.8.22"/g' {} +
          
          # 3. Отключаем строгие проверки SDK в gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "android.defaultConfig.vectorDrawables.useSupportLibrary=true" >> android/gradle.properties

      - name: Build APK Release
        run: flutter build apk --release --track-widget-creation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
