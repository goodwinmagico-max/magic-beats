name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply build configuration fixes
        run: |
          # 1. Устанавливаем minSdkVersion 23 в app/build.gradle
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
          
          # 2. Обновляем версию Kotlin везде, где она встречается в android/
          find android -type f \( -name "build.gradle" -o -name "settings.gradle" \) -exec sed -i 's/1\.7\.[0-9]*/1.8.22/g' {} +
          find android -type f \( -name "build.gradle" -o -name "settings.gradle" \) -exec sed -i 's/1\.8\.10/1.8.22/g' {} +
          find android -type f \( -name "build.gradle" -o -name "settings.gradle" \) -exec sed -i 's/kotlin_version = .*/kotlin_version = "1.8.22"/g' {} +
          
          # 3. Отключаем строгие предупреждения SDK
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "android.defaultConfig.vectorDrawables.useSupportLibrary=true" >> android/gradle.properties

      - name: Build APK Release
        run: flutter build apk --release --track-widget-creation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
