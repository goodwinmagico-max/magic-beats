android {
    namespace "com.example.magic_beats"
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.example.magic_beats"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    // Добавляем этот блок, чтобы R8 не вырезал классы записи звука
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
